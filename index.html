<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6fb8">
<title>부산 부모님 여행 3박4일</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><h1>🌊 부모님과 부산 3박4일</h1><p>월 14:00 ~ 목 14:00 · 평지 위주, 앉아서 감상하는 코스</p></div></header>
<div class="wrap">
 <div class="bar">
  <div class="tabs" id="tabs">
   <button class="tab" data-t="plan">📅 전체 일정</button>
   <button class="tab" data-t="spot">🏞️ 명소</button>
   <button class="tab" data-t="food">🍲 맛집</button>
   <a class="tab" href="planner.html">✏️ 일정 짜기</a>
  </div>
  <div class="tools">
   <input type="search" id="q" placeholder="검색 (장소, 메뉴, 지역, 메모)">
   <div class="chips" id="days"></div>
  </div>
 </div>
 <div class="btns io" id="io"><button class="b" id="exp">⬇ 최종 일정 내려받기(JSON)</button><button class="b" id="imp">⬆ 일정 파일 불러오기</button></div>
 <main id="out"></main>
</div>
<footer>※ 영업시간·휴무는 방문 전 확인하세요. 사진·소개는 위키백과/위키미디어 커먼즈에서 불러옵니다.</footer>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const h0=new URLSearchParams(location.hash.slice(1));
const st={t:h0.get("t")||"plan",day:h0.get("d")||"전체",q:""};
const hit=a=>st.q===""||a.join(" ").toLowerCase().includes(st.q);
const dayOk=d=>st.day==="전체"||st.day===d;

function render(){
 $("#io").hidden=st.t!=="plan";
 history.replaceState(null,"","#t="+st.t+"&d="+enc(st.day));
 [...$("#tabs").children].forEach(c=>c.classList.toggle("on",c.dataset.t===st.t));
 [...$("#days").children].forEach(c=>c.classList.toggle("on",c.dataset.d===st.day));
 let h="";
 if(st.t==="plan"){
  const plan=loadPlan().sort((a,b)=>DAYS.indexOf(a[0])-DAYS.indexOf(b[0]));let n=0;
  if(isDirty())h+='<div class="note">✏️ 저장하지 않은 수정이 이 기기에 있어요. <a href="planner.html">편집·저장하기</a></div>';
  DAYS.filter(dayOk).forEach(d=>{
   const rows=plan.map((r,pi)=>({r,pi})).filter(x=>x.r[0]===d&&hit(x.r.slice(0,5)));
   if(!rows.length)return;
   h+=`<h2 class="day">${D[d]}</h2>`;
   rows.forEach(({r,pi})=>{
    n++;
    let more="";
    if(r[6]){const[t,i]=r[6].split(":");more=`<a class="b pri" href="${detailUrl(t,i)}">상세 보기 →</a>`;}
    h+=`<div class="row"><div class="time">${esc(r[1])}</div><div class="main">${r[3]?`<span class="tag">${esc(r[3])}</span>`:""}<b>${esc(r[2])}</b>${r[4]?`<div class="memo">${esc(r[4])}</div>`:""}${r[5]?btns(r[5]).replace("</div>",more+"</div>"):""}</div><a class="b edit-link" href="planner.html#edit=${pi}" aria-label="이 일정 바꾸기">✏️ 바꾸기</a></div>`;
   });
  });
  $("#out").innerHTML=n?h:'<div class="empty">검색 결과가 없습니다.</div>';
  return;
 }
 const spot=st.t==="spot";
 const f=LIST[st.t].map((r,i)=>({r,i})).filter(({r})=>dayOk(r[0])&&hit(r.slice(0,5)));
 $("#out").innerHTML=f.length?'<div class="grid">'+f.map(({r,i},k)=>{
  const emo=spot?r[4]:r[5];
  const sub=spot?`<span class="score">⭐ ${r[2]}</span>`:`<span class="score" style="font-size:.85rem;color:var(--sub)">${esc(r[2])}</span>`;
  const memo=spot?r[3]:[r[3],r[4]].filter(Boolean).join(" · ");
  return `<div class="card"><a class="go" href="${detailUrl(st.t,i)}"><div class="thumb" data-i="${i}" style="background-image:linear-gradient(135deg,${GRAD[k%GRAD.length]})"><span>${emo}</span><span class="d">${D[r[0]]}</span></div><div class="cb"><h3>${esc(r[1])}${sub}</h3><div class="memo">${esc(memo)}</div></div></a>${btns(spot?r[5]:"부산 "+r[6])}</div>`;
 }).join("")+"</div>":'<div class="empty">검색 결과가 없습니다.</div>';
 // 사진 비동기 로딩
 document.querySelectorAll(".thumb").forEach(async el=>{
  const r=LIST[st.t][el.dataset.i],[w,c]=wikiOf(st.t,r);
  const info=await fetchInfo(w,c);
  if(info&&el.isConnected){const im=new Image();im.alt=r[1];im.loading="lazy";im.referrerPolicy="no-referrer";im.onload=()=>{el.querySelector("span").style.display="none";el.prepend(im);};im.src=info.img;}
 });
}
$("#days").innerHTML=["전체","월","화","수","목"].map(d=>`<button class="chip" data-d="${d}">${d}</button>`).join("");
$("#days").onclick=e=>{const d=e.target.dataset.d;if(d){st.day=d;render();}};
$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(t){st.t=t;render();}};
$("#q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render();};
$("#exp").onclick=exportData;$("#imp").onclick=pickAndImport;
READY.then(render);
</script>
</body>
</html>
