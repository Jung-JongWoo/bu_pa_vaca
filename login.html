<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6fb8">
<title>편집 모드 · 부산 부모님 여행</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a href="index.html"><h1>🌊 부모님과 부산 3박4일</h1></a><p>보기 전용 / 편집 모드 선택</p></div></header>
<div class="wrap">
 <div class="panel">
  <h2>👀 보기 전용</h2>
  <p class="memo">일정·명소·맛집을 보기만 해요. 수정과 저장은 할 수 없어요.</p>
  <div class="btns"><a class="b pri" href="index.html" id="view">보기 전용으로 입장</a></div>
 </div>
 <div class="panel">
  <h2>✏️ 편집 모드</h2>
  <p class="memo">GitHub 토큰을 한 번 저장하면 이 기기에서는 다시 입력하지 않아도 돼요. (이 저장소 하나, Contents 읽기/쓰기 권한의 fine-grained 토큰)</p>
  <p id="state" class="memo" style="margin-top:8px"></p>
  <form id="f" class="frm" style="margin-top:8px">
   <input type="password" id="tk" placeholder="GitHub 토큰 (github_pat_…)" autocomplete="off" style="grid-column:1/-1">
  </form>
  <div class="btns">
   <button class="b pri" id="save" style="min-height:40px;cursor:pointer">토큰 저장하고 편집 모드 켜기</button>
   <button class="b" id="env" style="min-height:40px;cursor:pointer">📄 .env 파일에서 불러오기</button>
   <button class="b del" id="del" style="min-height:40px;cursor:pointer" hidden>저장된 토큰 삭제</button>
  </div>
  <p id="msg" class="memo" style="margin-top:8px"></p>
  <p class="memo" style="margin-top:8px">※ 토큰은 이 브라우저(localStorage)에만 저장되고 서버로 보내지 않아요. 공용 기기에서는 쓰지 말고, 끝나면 삭제하세요.</p>
 </div>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const p=new URLSearchParams(location.search);
let next=p.get("next")||"index.html";
if(!/^[\w\-.]+\.html([?#].*)?$/.test(next))next="index.html";
function refresh(){
 const on=canEdit();
 $("#state").textContent=on?"✔ 편집 모드가 켜져 있어요. (토큰 저장됨)":"현재 보기 전용이에요.";
 $("#del").hidden=!on;
}
const say=(t,ok)=>{const m=$("#msg");m.textContent=t;m.style.color=ok?"var(--green)":"#e8590c";};
$("#save").onclick=async()=>{
 const t=$("#tk").value.trim();
 if(!t){say("토큰을 입력하세요.",false);return;}
 say("확인 중…",true);
 const r=await checkToken(t);
 if(!r.ok){say(r.msg,false);return;}
 saveTokenLocal(t);$("#tk").value="";refresh();say("저장했어요. 이동합니다…",true);
 setTimeout(()=>location.href=next,600);
};
$("#env").onclick=()=>pickEnvFile(r=>{if(r.ok){refresh();say("토큰을 불러왔어요. 편집 모드가 켜졌어요.",true);setTimeout(()=>location.href=next,800);}});
$("#del").onclick=()=>{if(confirm("저장된 토큰을 삭제할까요? (보기 전용으로 돌아가요)")){clearTokenLocal();refresh();say("삭제했어요.",true);}};
refresh();
</script>
</body>
</html>
