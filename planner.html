<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6fb8">
<title>일정 짜기 · 부산 부모님 여행</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a href="index.html"><h1>🌊 부모님과 부산 3박4일</h1></a><p>일정 다시 짜기 · 수정 내용은 이 기기의 브라우저에 자동 저장돼요</p></div></header>
<div class="wrap">
 <div class="bar">
  <div class="tools" style="margin:0">
   <a class="b pri" href="index.html">← 일정 보기</a>
   <button class="b" id="sort">⏱ 시간순 정렬</button>
   <button class="b" id="reset">↺ 원래대로</button>
   <span class="saved" id="saved"></span>
  </div>
 </div>
 <main id="out"></main>
 <h2 class="day">➕ 내 명소·맛집 등록</h2>
 <form class="panel" id="addForm">
  <p class="memo">등록하면 명소/맛집 탭, 상세페이지, 일정에 바로 추가돼요. (이 기기에만 저장)</p>
  <div class="frm">
   <select id="f-type"><option value="spot">🏞️ 명소</option><option value="food">🍲 맛집</option></select>
   <select id="f-day"></select>
   <input type="time" id="f-time" value="12:00">
   <input type="text" id="f-name" placeholder="이름 (필수)" required>
   <input type="text" id="f-area" placeholder="지역 (예: 해운대)">
   <input type="text" id="f-extra" placeholder="메뉴 (맛집)">
   <input type="number" id="f-score" min="0" max="10" step="0.5" placeholder="추천도 0~10 (명소)">
   <input type="text" id="f-memo" placeholder="메모">
   <input type="text" id="f-map" placeholder="지도 검색어 (비우면 이름으로 검색)">
  </div>
  <button class="b pri" type="submit" style="margin-top:10px;min-height:40px;cursor:pointer">＋ 등록하고 일정에 넣기</button>
 </form>
 <h2 class="day">내가 등록한 장소</h2>
 <div id="mine"></div>
</div>
<footer>※ 저장은 이 브라우저(localStorage)에만 되며, 다른 기기와는 공유되지 않아요.</footer>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
let plan=loadPlan();
const byDay=()=>plan.sort((a,b)=>DAYS.indexOf(a[0])-DAYS.indexOf(b[0])); // 안정 정렬
let tm;
function save(){savePlan(plan);const s=$("#saved");s.textContent="✔ 저장됨";clearTimeout(tm);tm=setTimeout(()=>s.textContent="",1500);}
const opts=()=>'<option value="">＋ 명소/맛집에서 추가…</option><optgroup label="명소">'+SPOT.map((r,i)=>`<option value="spot:${i}">${esc(r[1])}</option>`).join("")+'</optgroup><optgroup label="맛집">'+FOOD.map((r,i)=>`<option value="food:${i}">${esc(r[1])}</option>`).join("")+'</optgroup>';
function render(){
 byDay();
 $("#out").innerHTML=DAYS.map(d=>{
  const rows=plan.map((r,i)=>({r,i})).filter(x=>x.r[0]===d);
  return `<h2 class="day">${D[d]}</h2>`+rows.map(({r,i},k)=>`
  <div class="ed" data-i="${i}">
   <div class="ed-top"><input type="time" data-f="1" value="${esc(r[1])}"><input type="text" class="grow" data-f="2" value="${esc(r[2])}" placeholder="일정"></div>
   <input type="text" data-f="4" value="${esc(r[4])}" placeholder="메모 (선택)">
   <div class="ed-top"><input type="text" class="grow" data-f="3" value="${esc(r[3])}" placeholder="지역 (선택)"><input type="text" class="grow" data-f="5" value="${esc(r[5])}" placeholder="지도 검색어 (선택)"></div>
   <div class="ed-act">
    <button class="b" data-a="up" ${k===0?"disabled":""} aria-label="위로">↑</button>
    <button class="b" data-a="down" ${k===rows.length-1?"disabled":""} aria-label="아래로">↓</button>
    <select data-a="day" aria-label="요일 변경">${DAYS.map(x=>`<option${x===d?" selected":""}>${x}</option>`).join("")}</select>
    ${r[6]?`<a class="b" href="${detailUrl(...r[6].split(":"))}">상세</a>`:""}
    <button class="b del" data-a="del" aria-label="삭제">✕ 삭제</button>
   </div>
  </div>`).join("")+`<div class="ed-add"><button class="b pri" data-add="${d}">＋ 직접 추가</button><select data-addsel="${d}">${opts()}</select></div>`;
 }).join("");
}
$("#out").addEventListener("input",e=>{
 const el=e.target,box=el.closest(".ed");if(!box||!el.dataset.f)return;
 plan[+box.dataset.i][+el.dataset.f]=el.value;save();
});
$("#out").addEventListener("click",e=>{
 const el=e.target.closest("button");if(!el)return;
 if(el.dataset.add){plan.push([el.dataset.add,"09:00","새 일정","","","",""]);save();render();const last=plan.map((r,i)=>i).filter(i=>plan[i][0]===el.dataset.add).pop();document.querySelector(`.ed[data-i="${last}"] input[data-f="2"]`)?.select();return;}
 const box=el.closest(".ed");if(!box)return;
 const i=+box.dataset.i,a=el.dataset.a;
 if(a==="del"){if(confirm("이 일정을 삭제할까요?")){plan.splice(i,1);save();render();}return;}
 if(a==="up"||a==="down"){
  let j=i+(a==="up"?-1:1);
  while(plan[j]&&plan[j][0]!==plan[i][0])j+=(a==="up"?-1:1);
  if(plan[j]){[plan[i],plan[j]]=[plan[j],plan[i]];save();render();}
 }
});
$("#out").addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.a==="day"){plan[+el.closest(".ed").dataset.i][0]=el.value;save();render();}
 if(el.dataset.addsel&&el.value){
  const[t,k]=el.value.split(":"),r=LIST[t][+k],spot=t==="spot";
  plan.push([el.dataset.addsel,"09:00",spot?r[1]:"식사: "+r[1],spot?"":r[3],spot?r[3]:r[4],spot?r[5]:"부산 "+r[6],el.value]);
  save();render();
 }
});
$("#sort").onclick=()=>{plan.sort((a,b)=>DAYS.indexOf(a[0])-DAYS.indexOf(b[0])||String(a[1]).localeCompare(String(b[1])));save();render();};
$("#reset").onclick=()=>{if(confirm("수정한 내용을 모두 지우고 원래 일정으로 되돌릴까요?")){resetPlan();plan=loadPlan();render();}};

// ---- 내 장소 등록 ----
$("#f-day").innerHTML=DAYS.map(d=>`<option>${d}</option>`).join("");
const isFood=()=>$("#f-type").value==="food";
function syncForm(){$("#f-extra").hidden=!isFood();$("#f-score").hidden=isFood();}
$("#f-type").onchange=syncForm;syncForm();
function renderMine(){
 const items=[["spot","명소"],["food","맛집"]].flatMap(([t,l])=>LIST[t].map((r,i)=>({t,l,r,i})).filter(x=>x.i>=BASE[x.t]));
 $("#mine").innerHTML=items.length?items.map(({t,l,r,i})=>`<div class="ed-add" style="align-items:center"><span class="tag">${l}</span><a href="${detailUrl(t,i)}" style="flex:1">${esc(r[1])}</a><button class="b del" style="margin-left:0" data-del="${t}:${i}">✕ 삭제</button></div>`).join(""):'<p class="memo">아직 없어요.</p>';
}
$("#mine").onclick=e=>{
 const b=e.target.closest("[data-del]");if(!b||!confirm("이 장소를 삭제할까요? (일정의 연결도 해제돼요)"))return;
 const[t,k]=b.dataset.del.split(":"),i=+k;
 CUSTOM[t].splice(i-BASE[t],1);LIST[t].splice(i,1);saveCustom();
 plan.forEach(r=>{if(!r[6])return;const[rt,ri]=r[6].split(":");if(rt!==t)return;if(+ri===i)r[6]="";else if(+ri>i)r[6]=t+":"+(ri-1);});
 save();render();renderMine();
};
$("#addForm").onsubmit=e=>{
 e.preventDefault();
 const t=$("#f-type").value,name=$("#f-name").value.trim(),area=$("#f-area").value.trim(),memo=$("#f-memo").value.trim(),d=$("#f-day").value;
 if(!name)return;
 const map=$("#f-map").value.trim()||name;
 let row;
 if(t==="spot")row=[d,name,Number($("#f-score").value)||0,memo,"📍",map,"",""];
 else row=[d,name,$("#f-extra").value.trim()||"-",area,memo,"🍽️",map,"",""];
 CUSTOM[t].push(row);LIST[t].push(row);saveCustom();
 const i=LIST[t].length-1;
 plan.push([d,$("#f-time").value||"09:00",t==="food"?"식사: "+name:name,area,memo,t==="food"?"부산 "+map:map,t+":"+i]);
 save();render();renderMine();opts_refresh();
 e.target.reset();$("#f-day").value=d;syncForm();
};
function opts_refresh(){}
render();renderMine();
</script>
</body>
</html>
